# FlowCode Playground — no Dockerfile, no prebuilt image, no CI.
#
# The service is a plain `golang:1.25-alpine` base image. On every
# `docker compose up -d` it runs scripts/docker-entrypoint.sh, which installs
# the rest of the toolchain (Node, a C compiler, git) and builds FlowCode,
# the frontend, and the server — then execs the result. The whole repo is
# bind-mounted at /src, so every cache (apk, FlowCode's git clone, Go's
# module/build cache, npm's cache) and every build artifact lives on the
# host under .buildcache/, and survives across deploys: `git pull` on the
# host followed by `docker compose up -d` only rebuilds what changed, it
# never redownloads dependencies from scratch.
#
#   git pull
#   docker compose up -d
#   docker compose logs -f
#
# Pin FlowCode's revision for a reproducible build — `main` is the
# convenient default, not the reproducible one:
#
#   FLOWCODE_REF=v0.1.0 docker compose up -d

services:
  playground:
    image: golang:1.25-alpine
    container_name: flowcode-playground
    restart: unless-stopped
    working_dir: /src
    command: ["sh", "/src/scripts/docker-entrypoint.sh"]

    # Only 8033 is ever published to the host. Everything else (the build
    # toolchain, the compiled binaries, the caches) is internal to the
    # container/bind mounts and never gets its own port.
    ports:
      - "8033:8033"

    environment:
      PORT: "8033"
      FLOWCODE_REPO: "${FLOWCODE_REPO:-https://github.com/tayyebi/flowcode.git}"
      FLOWCODE_REF: "${FLOWCODE_REF:-main}"
      # How long a single compile or run may take before it is killed. The VM
      # has no instruction budget, so this is what stops a runaway workflow.
      PLAYGROUND_TIMEOUT: "${PLAYGROUND_TIMEOUT:-5s}"
      # Concurrent compile+run slots. Requests past this wait, then get a 503.
      PLAYGROUND_MAX_CONCURRENT: "${PLAYGROUND_MAX_CONCURRENT:-4}"
      PLAYGROUND_RATE_PER_MINUTE: "${PLAYGROUND_RATE_PER_MINUTE:-30}"
      PLAYGROUND_RATE_BURST: "${PLAYGROUND_RATE_BURST:-10}"
      # Separate budget for public /deploy/{slug} traffic, so it can't starve
      # (or be starved by) the anonymous playground's own /api/run budget.
      PLAYGROUND_DEPLOY_RATE_PER_MINUTE: "${PLAYGROUND_DEPLOY_RATE_PER_MINUTE:-60}"
      PLAYGROUND_DEPLOY_RATE_BURST: "${PLAYGROUND_DEPLOY_RATE_BURST:-20}"
      # Set to 1 only when a reverse proxy you control sets X-Forwarded-For.
      # Otherwise any client can forge the header and get its own rate bucket.
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      # A single shared secret gating /api/projects... (saved projects,
      # deployments, triggers, executions, kv). Leave unset for a fully open
      # instance, same posture as before Projects existed. Never gates
      # /api/run, /api/samples, /healthz, or a deployment's public URL.
      PLAYGROUND_ADMIN_TOKEN: "${PLAYGROUND_ADMIN_TOKEN:-}"

    volumes:
      # The whole repo. Source, build caches (.buildcache/), and build
      # outputs (web/dist, .buildcache/bin/) all live here — on the host —
      # so nothing produced by a build is trapped inside the container.
      - .:/src
      # apk hardcodes this path as its package cache when the directory
      # exists, so it has to be a real mount rather than living under
      # .buildcache/ like everything else the entrypoint script controls.
      - ./.buildcache/apk-cache:/etc/apk/cache
      # Persistent SQLite database (projects, versions, deployments,
      # triggers, executions, kv log) — must survive restarts and rebuilds.
      - ./data:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8033/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      # The first run compiles FlowCode, the frontend, and the server from
      # scratch — give it real time before the healthcheck starts failing.
      start_period: 180s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
