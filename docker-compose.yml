# FlowCode Playground — no Dockerfile, no prebuilt image, no CI.
#
# The service is a plain `golang:1.26-alpine` base image. On every
# `docker compose up -d` it runs scripts/docker-entrypoint.sh, which installs
# the rest of the toolchain (a C compiler, git) and builds FlowCode and the
# server — then execs the result. The whole repo is
# bind-mounted at /src, so every cache (apk, FlowCode's git clone, Go's
# module/build cache) and every build artifact lives on the
# host under .buildcache/, and survives across deploys: `git pull` on the
# host followed by `docker compose up -d` only rebuilds what changed, it
# never redownloads dependencies from scratch.
#
#   git pull
#   docker compose up -d
#   docker compose logs -f
#
# Pin FlowCode's revision for a reproducible build — `main` is the
# convenient default, not the reproducible one:
#
#   FLOWCODE_REF=v0.1.0 docker compose up -d
#
# Authentication is OIDC (any discovery-based provider); the three OIDC
# variables are the only application configuration in the environment.
# Everything else — SMTP/IMAP credentials, the Loki push URL, quotas, run
# limits — is managed by system administrators in the /admin area and stored
# in the database. Promote the first admin manually:
#
#   sqlite3 data/playground.db "UPDATE users SET is_admin=1 WHERE email='you@example.com';"
#
# Optional: `docker compose -f docker-compose.override.yml up -d` adds a
# local Loki for Logger.log (configure Logger → http://loki:3100 in /admin).

services:
  playground:
    image: golang:1.26-alpine
    container_name: flowcode-playground
    restart: unless-stopped
    working_dir: /src
    command: ["sh", "/src/scripts/docker-entrypoint.sh"]

    # Only 8033 is ever published to the host. Everything else (the build
    # toolchain, the compiled binaries, the caches) is internal to the
    # container/bind mounts and never gets its own port.
    ports:
      - "8033:8033"

    environment:
      PORT: "8033"
      FLOWCODE_REPO: "${FLOWCODE_REPO:-https://github.com/tayyebi/flowcode.git}"
      FLOWCODE_REF: "${FLOWCODE_REF:-main}"
      # --- the only app configuration in the environment: OIDC ---
      OIDC_ISSUER: "${OIDC_ISSUER:?set OIDC_ISSUER, e.g. https://auth.example.com/realms/main}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}"
      # Defaults to http://<request-host>/api/auth/callback when unset.
      OIDC_REDIRECT_URL: "${OIDC_REDIRECT_URL:-}"
      # Set to 1 only when a reverse proxy you control sets X-Forwarded-For.
      # Otherwise any client can forge the header and get its own rate bucket.
      TRUST_PROXY: "${TRUST_PROXY:-0}"

    volumes:
      # The whole repo. Source, build caches (.buildcache/), and build
      # outputs (.buildcache/bin/) all live here — on the host — so nothing
      # produced by a build is trapped inside the container.
      - .:/src
      # apk hardcodes this path as its package cache when the directory
      # exists, so it has to be a real mount rather than living under
      # .buildcache/ like everything else the entrypoint script controls.
      - ./.buildcache/apk-cache:/etc/apk/cache
      # Persistent SQLite database (users, workspaces, projects, executions,
      # app calls, settings) — must survive restarts and rebuilds.
      - ./data:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8033/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      # The first run compiles FlowCode and the server from scratch — give it
      # real time before the healthcheck starts failing.
      start_period: 180s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
