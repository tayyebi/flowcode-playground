# TLS reverse proxy in front of the two Go services. One published port,
# three jobs:
#
#   /static/*  served straight from the bind-mounted repo ./static dir —
#              the single source of truth for UI assets; the Go binaries
#              serve no static files at all
#   /admin/*   → the administration service (own OIDC login, own database
#              table for administrators)
#   everything else → the playground (user area)
#
# TLS certificates live in /certs (host ./certs, git-ignored, persistent):
# the entrypoint generates a self-signed pair on first boot, and dropping in
# real certificates + a restart is the upgrade path.
#
# A second vhost on :9443 fronts the local-rig IdP (see the second server
# block below) — inert on real deploys, where no idaas service exists and
# the port is never published.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Matches the app's own request-size limits with headroom.
    client_max_body_size 2m;

    # Docker's embedded DNS resolver, polled so a restarted backend's new IP
    # is picked up at runtime — a static proxy_pass hostname would be
    # resolved once at startup and go stale after every backend restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # UI assets, served directly by nginx — never proxied to Go.
    location /static/ {
        alias /srv/static/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Administration area: forwarded unchanged (the admin binary serves its
    # pages under /admin/... natively, so no path rewriting).
    location /admin {
        set $admin_upstream http://admin:8034;
        proxy_pass $admin_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $playground_upstream http://playground:8033;
        proxy_pass $playground_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# The local test rig's IdP (docker-compose.override.yml runs the `idaas`
# service and publishes 9443; on a real deploy neither exists, and this
# block never receives traffic). Same self-signed certificate as the main
# vhost — the Go backends reach the issuer through their localhost bridges
# and trust that certificate via SSL_CERT_FILE.
server {
    listen 9443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $idaas_upstream http://idaas:8080;
        proxy_pass $idaas_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
