# Throw-away local test rig. Compose merges this file automatically on plain
# `docker compose up` when it is present; without it, nothing changes.
#
# Three self-built mocks (throw-away/), each with a web GUI and a single
# JSON file as its database (under throw-away/data/):
#
#   oidc-mock      a complete mock OIDC provider — full code flow with real
#                  RS256-signed ID tokens, GUI at http://localhost:9400
#                  (identity picker on login, identity manager, login log)
#   mail-mock      an SMTP sink with an inbox GUI at http://localhost:8025;
#                  accept SMTP internally on :1025 (configure the Mail app
#                  with host `mail-mock`, port 1025)
#   loki-mock      a Loki stand-in: accepts Logger.log pushes and serves
#                  query_range, GUI at http://localhost:3100 (configure the
#                  Logger app with push URL `http://loki-mock:3100`)
#
#   oidc-localhost-bridge  the issuer is http://localhost:9400, which the
#                  browser reaches via the published port — but the
#                  playground container would resolve "localhost" to itself.
#                  This tiny socat sidecar shares the playground's network
#                  namespace and forwards its localhost:9400 to the host, so
#                  one issuer string works for both.
#
# The base compose file still interpolates ${OIDC_ISSUER:?} at parse time, so
# create a `.env` next to it (or export the vars) before `up`:
#
#   cat > .env <<'EOF'
#   OIDC_ISSUER=http://localhost:9400
#   OIDC_CLIENT_ID=playground
#   OIDC_CLIENT_SECRET=mock-secret
#   EOF
#
# Then sign in at http://localhost:8033 and pick an identity.

x-mock-base: &mock-base
  image: golang:1.26-alpine
  restart: unless-stopped
  volumes:
    - .:/src:ro
    - ./.buildcache/go:/go
    - ./.buildcache/go-build:/.cache/go-build
    - ./throw-away/data:/data
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:
  playground:
    depends_on:
      - oidc-mock
    environment:
      OIDC_ISSUER: "http://localhost:9400"
      OIDC_CLIENT_ID: "playground"
      OIDC_CLIENT_SECRET: "mock-secret"
      OIDC_REDIRECT_URL: "http://localhost:8033/api/auth/callback"
      LOKI_URL: "http://loki-mock:3100"

  oidc-mock:
    <<: *mock-base
    container_name: flowcode-oidc-mock
    working_dir: /src/throw-away/oidc-mock
    command: ["sh", "-c", "exec go run ."]
    environment:
      ISSUER: "http://localhost:9400"
      LISTEN: ":9400"
      DB: "/data/oidc-mock.json"
    ports:
      - "9400:9400"

  # The playground's view of the mock: localhost:9400 inside its own network
  # namespace, forwarded to the mock over the compose network's DNS.
  oidc-localhost-bridge:
    image: alpine/socat
    container_name: flowcode-oidc-bridge
    restart: unless-stopped
    network_mode: "service:playground"
    command: "TCP-LISTEN:9400,fork,reuseaddr TCP:oidc-mock:9400"
    depends_on:
      - playground
      - oidc-mock
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  mail-mock:
    <<: *mock-base
    container_name: flowcode-mail-mock
    working_dir: /src/throw-away/mail-mock
    command: ["sh", "-c", "exec go run ."]
    environment:
      DB: "/data/mail-mock.json"
    ports:
      - "8025:8025" # inbox GUI; SMTP stays internal on :1025 as mail-mock:1025

  loki-mock:
    <<: *mock-base
    container_name: flowcode-loki-mock
    working_dir: /src/throw-away/loki-mock
    command: ["sh", "-c", "exec go run ."]
    environment:
      DB: "/data/loki-mock.json"
    ports:
      - "3100:3100" # GUI + push API; the playground pushes to loki-mock:3100
