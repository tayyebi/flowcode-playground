# OIDC client registry for the local rig's idaas (see docker-compose.override.yml).
# The [section] name is the client_id; redirect URIs are matched exactly.
# The secrets match the OIDC_CLIENT_SECRET values pinned in the override file.

[playground]
secret = mock-secret
redirect_uri = https://localhost/api/auth/callback
scope = openid profile email

[playground-admin]
secret = mock-secret
redirect_uri = https://localhost/admin/api/auth/callback
scope = openid profile email
