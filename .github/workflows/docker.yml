name: Publish image

# Builds the playground image and pushes it to GHCR, where docker-compose.yml
# expects to find it:
#
#   main             -> :latest and :sha-<short>
#   tag v1.2.3       -> :1.2.3, :1.2, :1 (and :latest via metadata-action)
#   manual dispatch  -> whatever the ref produces, against a chosen FLOWCODE_REF

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      flowcode_ref:
        description: "FlowCode tag, branch, or commit SHA to build against"
        required: false
        default: "main"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: build & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated on the amd64 runner. It is slow, but the alternative
      # is an image that won't run on Apple silicon or Graviton.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=FlowCode Playground
            org.opencontainers.image.description=Write, compile, and run FlowCode workflows in the browser.

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FLOWCODE_REF=${{ github.event.inputs.flowcode_ref || 'main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull the image that was just published and exercise it, so a broken
      # push is caught here rather than by whoever runs `docker compose up`
      # next. Only the native platform is testable on this runner.
      - name: Verify the published image
        run: |
          set -eux
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker pull --platform linux/amd64 "$IMAGE"
          docker run -d --name verify -p 8080:8080 \
            --read-only \
            --tmpfs /run/play:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            "$IMAGE"

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then break; fi
            sleep 1
          done

          python3 scripts/smoke.py http://localhost:8080

      - name: Container logs
        if: failure()
        run: docker logs verify || true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "Built against FlowCode ref: \`${{ github.event.inputs.flowcode_ref || 'main' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
